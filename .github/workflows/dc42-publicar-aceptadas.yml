name: DC42 publicar celadas aprobadas (temporal)
on:
  push:
    branches:
      - dc42/celada-primeras-10-20261116
    paths:
      - .github/workflows/dc42-publicar-aceptadas.yml
permissions:
  contents: write
jobs:
  sustituir-imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc42/celada-primeras-10-20261116
          persist-credentials: true
      - name: Descargar los nueve WebP originales y verificar SHA256
        env:
          SOURCE: https://sb-6kt7i9dhab3u.vercel.run
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, time
          hashes = {
          '02_p1_c02_h01_i01_salida_corral_story.webp': 'e0f49d57f2b80203eadbf57420067ec4b6de8fdbbfb53ef297f04b131aecae8c',
          '03_p1_c02_h02_i01_duda_investidura_story.webp': '34e79f588ce9516af26a8fe86a095eb129e52911bae5db57517fa77139d08a17',
          '04_p1_c02_h02_i02_resolucion_armarse_story.webp': '1bf38addf688bc54394e748ea82be76c96617bfceff32a88705d555b3209009e',
          '05_p1_c02_h03_camino_monologos_story.webp': '1f4eebe85c65928b89a2ab3d1d451c0681b2698ead01ad22e3914bde17c85d53',
          '06_p1_c02_h03_i01_cronista_hazanas_story.webp': 'b296c989e6ba5b847d5ba2a5efa9972ad6e07216be86749a235b6b2c307771d4',
          '07_p1_c02_h03_i03_dulcinea_sol_story.webp': 'f9adb8fc7f5d8ea76ffe7baaee3edaf7c2d501d4df3c68b6e07da90508dbcb1f',
          '08_p1_c02_h04_i01_cansancio_hambre_story.webp': 'cd7c4442bb375729b48b0d5c98d696f2a95abf9ff59b83c7d24263177fb96f16',
          '09_p1_c02_h05_espera_trompeta_story.webp': '1341a6e7087f1ab71d5120052a0ca740787468826052a8bb56ccc8d6bf70a4e8',
          '10_p1_c02_h05_i02_cuerno_porquero_story.webp': 'ec63093f2d8dccd0c20cff8858bf37fe0af28db2ed7e15bec9580f75f049d292',
          }
          dest = pathlib.Path('assets/scenes/_dc42_review/primeras10')
          for filename, expected in hashes.items():
              url = f'https://sb-6kt7i9dhab3u.vercel.run/{filename}'
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'DC42-GitHub-Actions'})
                      with urllib.request.urlopen(req, timeout=120) as res:
                          body = res.read()
                      break
                  except Exception as exc:
                      last = exc
                      time.sleep(3 * (attempt + 1))
              else:
                  raise RuntimeError(f'No se pudo descargar {filename}: {last}')
              actual = hashlib.sha256(body).hexdigest()
              if actual != expected or not (body[:4] == b'RIFF' and body[8:12] == b'WEBP'):
                  raise ValueError(f'Archivo inválido o hash incorrecto: {filename} {actual}')
              target = dest / filename
              if not target.exists():
                  raise FileNotFoundError(target)
              target.write_bytes(body)
              print(f'VERIFICADO {filename}: {len(body)} bytes, sha256 {actual}', flush=True)
          note = pathlib.Path('docs/DC42_ACEPTACION_CELADA_CAPITULO_II_2026-11-18.md')
          note.write_text(
              '# DC-42 — Aceptación de las nueve celadas corregidas del capítulo II\n\n'
              'Fecha: 18 de noviembre de 2026.\n\n'
              'El usuario ha aceptado las imágenes 02 a 10 con frontal de cartón sobre el rostro. '
              'Se sustituyen los nueve WebP de revisión rechazados por los WebP aprobados, '
              'verificados contra SHA-256 en la rama dc42/celada-primeras-10-20261116.\n\n'
              'La imagen 01 (capítulo I) queda intacta; la rama main y las imágenes activas '
              'de la aplicación no cambian.\n\n'
              + '\n'.join('- ' + name + ' — SHA-256: ' + sha for name, sha in hashes.items())
              + '\n', encoding='utf-8')
          PY
      - name: Registrar sustituciones y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scenes/_dc42_review/primeras10/*.webp docs/DC42_ACEPTACION_CELADA_CAPITULO_II_2026-11-18.md
          git rm -- .github/workflows/dc42-publicar-aceptadas.yml
          git diff --cached --check
          git commit -m 'DC-42: sustituir nueve celadas capítulo II aceptadas y registrar aprobación'
          git push origin HEAD:dc42/celada-primeras-10-20261116
