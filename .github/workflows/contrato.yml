# Validación del contrato editorial-técnico en GitHub (encargo §5.2 «Integración:
# GitHub Actions sobre Windows»; CONTRATO §10.5: la suite debe estar en PASS para
# fusionar cualquier PR que toque /schemas, /content o /tools).
#
# Comprueba, en cada PR y en cada push a main:
#   1. La suite de contrato (fixtures válidos + casos negativos §6.3.7).
#   2. El paquete REAL del piloto (content/piloto) contra los esquemas canónicos.
#   3. El criterio ADR-0001.1 (FTS5 con castellano áureo).
# El informe JSON se conserva como artefacto: evidencia de auditoría (§9).
name: contrato

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contrato:
    name: contrato
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Código
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dependencias del validador (jsonschema)
        run: python -m pip install -r tools/editorial_validation/requirements.txt

      - name: '1. Suite de contrato (fixtures + negativos §6.3.7)'
        run: >
          python tools/editorial_validation/validate.py suite tests/contracts/fixtures
          --json tests/contracts/last_validation_report.json

      - name: '2. Paquete real del piloto (content/piloto)'
        run: python tools/editorial_validation/validate.py package content/piloto/package.json

      - name: '3. Criterio ADR-0001.1 — FTS5 castellano áureo'
        run: python -I tests/dev/fts5_castellano_aureo.py

      # Evidencia: el veredicto de cada paso queda en el log del job (§9);
      # los informes JSON completos se generan igualmente en el runner.
      # Nota: no se suben artefactos — la cuota de almacenamiento de Actions
      # de esta cuenta está agotada y un fallo de cuota no debe poder tumbar
      # la compuerta del contrato.
