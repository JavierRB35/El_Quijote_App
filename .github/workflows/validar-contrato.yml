name: validar-contrato

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contrato:
    name: Validación del contrato editorial-técnico
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: el test de estructura literaria compara el
          # estado corregido con el estado plano previo de esta PR (git show).
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de validación
        run: pip install jsonschema

      - name: Suite canónica de contrato (fixtures válidos + negativos)
        run: python tools/editorial_validation/validate.py suite tests/contracts/fixtures

      - name: Meta-validación de esquemas (check_schema draft 2020-12)
        run: |
          python - <<'PY'
          import glob, json
          from jsonschema import Draft202012Validator
          fallos = []
          esquemas = sorted(glob.glob('schemas/**/*.schema.json', recursive=True))
          assert esquemas, "no hay esquemas en schemas/**"
          for s in esquemas:
              try:
                  Draft202012Validator.check_schema(json.load(open(s, encoding='utf-8')))
                  print('OK  ', s)
              except Exception as e:
                  fallos.append(s); print('FAIL', s, str(e)[:120])
          assert not fallos, f"esquemas inválidos: {fallos}"
          print(f"check_schema: {len(esquemas)}/{len(esquemas)} OK")
          PY

      - name: Paquetes editoriales reales
        run: |
          set -e
          for p in $(find content -name package.json); do
            echo "== $p =="
            python tools/editorial_validation/validate.py package "$p"
          done

      - name: Catálogo Aventura DC-34 (esquema, imágenes y referencias)
        run: python tools/editorial_validation/validar_aventura.py

      - name: Cobertura DC-37 (IDs, rutas, rondas y carencias)
        run: python -I tests/dev/test_auditoria_dc37.py

      - name: Integridad DC-35 de escenas aprobadas (SHA-256 y WebP)
        run: python -I tools/editorial_validation/validar_medios_aprobados.py

      - name: Capítulo I — Aventura, Historia, corpus y escenas
        run: python -I tests/dev/test_capitulo_01.py

      - name: Capítulo III — Aventura, Historia y activos en revisión
        run: python -I tests/dev/test_capitulo_03.py

      - name: Capítulo IV — rondas, Historia, WebP y fidelidad literaria
        run: python -I tests/dev/test_capitulo_04.py

      - name: Capítulo V — rondas, Historia, imágenes aprobadas y referencias
        run: python -I tests/dev/test_capitulo_05.py

      - name: Regresiones negativas del catálogo Aventura
        run: python tests/dev/test_catalogo_aventura.py

      - name: Cotejo textual de la batería contra el texto almacenado
        run: python tools/editorial_validation/cotejar_texto_referencia.py . repo

      - name: 'Criterio ADR-0001.1 — FTS5 castellano áureo'
        run: python -I tests/dev/fts5_castellano_aureo.py

      - name: 'Vista de conciliación QA R12 (recuentos del dictamen + identificación)'
        run: python -I tests/dev/test_vista_qa_r12.py

      - name: 'Verificación P0 del Modo Historia (molinos, I, 8): 16 intervenciones verbatim'
        run: python -I tests/dev/verificar_modo_historia_c08.py .

      - name: 'Regresión P0 PR #59 — estructura literaria de saltos (versos, párrafos, parlamentos)'
        run: python -I tests/dev/test_estructura_literaria.py .

      - name: 'Regresión P1 — límites de capítulo (sangrado I,20→I,21) y guardia fuzzy'
        run: python -I tests/dev/test_limites_capitulo.py .

      - name: 'Cobertura de presentación textual (0 saltos mecánicos residuales)'
        run: python -I tests/dev/informe_cobertura_presentacion.py .

  frontend:
    name: Construcción React/TypeScript y pruebas de lógica
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dependencias
        run: npm ci
        working-directory: app

      - name: Build (tsc + vite)
        run: npm run build
        working-directory: app

      - name: Pruebas de la lógica del Modo Historia
        run: npm test
        working-directory: app

  backend:
    name: Comprobación del backend Tauri/Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias de sistema de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Dist mínimo (generate_context exige frontendDist)
        run: |
          mkdir -p app/dist
          echo '<!doctype html><title>ci</title>' > app/dist/index.html

      - name: cargo check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml
